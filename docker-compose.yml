services:
  worker-base-build:
    build:
      context: .
      dockerfile: worker-base/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
        http_proxy: ${http_proxy}
        https_proxy: ${https_proxy}
        no_proxy: ${no_proxy}
    image: multica-worker-base:latest
    networks:
      - default
      - multica_external

  worker-codex-01: &codex-worker
    build:
      context: .
      dockerfile: worker-codex/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
        http_proxy: ${http_proxy}
        https_proxy: ${https_proxy}
        no_proxy: ${no_proxy}
    privileged: true
    restart: unless-stopped
    environment:
      MULTICA_SERVER_URL: ${MULTICA_SERVER_URL}
      MULTICA_APP_URL: ${MULTICA_APP_URL}
      MULTICA_TOKEN: ${MULTICA_CODEX_TOKEN_01}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GIT_USER_NAME: ${GIT_USER_NAME}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL}
      GIT_SSH_KEY_FILE: ${GIT_SSH_KEY_FILE}
      DEVICE_NAME: worker-codex-01
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      NO_PROXY: ${NO_PROXY}
      http_proxy: ${http_proxy}
      https_proxy: ${https_proxy}
      no_proxy: ${no_proxy}
      WORKER_RUNTIME_ROLE: coding
      OMX_HOST_PATH: ${OMX_HOST_PATH:-./omx}
      OMX_CONTAINER_PATH: ${OMX_CONTAINER_PATH:-/opt/omx}
      OMX_REQUIRED: ${OMX_REQUIRED:-true}
    volumes:
      - codex_multica_home_01:/root/.multica
      - ./codex-configs/codex-01:/root/.codex
      - ${USERPROFILE}/.ssh:/host-ssh:ro
      - ./workspaces/codex-01:/workspace
      - ${OMX_HOST_PATH:-./omx}:${OMX_CONTAINER_PATH:-/opt/omx}:ro
    depends_on:
      - worker-base-build
    networks:
      - default
      - multica_external

  worker-codex-02:
    <<: *codex-worker
    environment:
      MULTICA_SERVER_URL: ${MULTICA_SERVER_URL}
      MULTICA_APP_URL: ${MULTICA_APP_URL}
      MULTICA_TOKEN: ${MULTICA_CODEX_TOKEN_02}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GIT_USER_NAME: ${GIT_USER_NAME}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL}
      GIT_SSH_KEY_FILE: ${GIT_SSH_KEY_FILE}
      DEVICE_NAME: worker-codex-02
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      NO_PROXY: ${NO_PROXY}
      http_proxy: ${http_proxy}
      https_proxy: ${https_proxy}
      no_proxy: ${no_proxy}
      WORKER_RUNTIME_ROLE: coding
      OMX_HOST_PATH: ${OMX_HOST_PATH:-./omx}
      OMX_CONTAINER_PATH: ${OMX_CONTAINER_PATH:-/opt/omx}
      OMX_REQUIRED: ${OMX_REQUIRED:-true}
    volumes:
      - codex_multica_home_02:/root/.multica
      - ./codex-configs/codex-02:/root/.codex
      - ${USERPROFILE}/.ssh:/host-ssh:ro
      - ./workspaces/codex-02:/workspace
      - ${OMX_HOST_PATH:-./omx}:${OMX_CONTAINER_PATH:-/opt/omx}:ro

  worker-codex-03:
    <<: *codex-worker
    environment:
      MULTICA_SERVER_URL: ${MULTICA_SERVER_URL}
      MULTICA_APP_URL: ${MULTICA_APP_URL}
      MULTICA_TOKEN: ${MULTICA_CODEX_TOKEN_03}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GIT_USER_NAME: ${GIT_USER_NAME}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL}
      GIT_SSH_KEY_FILE: ${GIT_SSH_KEY_FILE}
      DEVICE_NAME: worker-codex-03
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      NO_PROXY: ${NO_PROXY}
      http_proxy: ${http_proxy}
      https_proxy: ${https_proxy}
      no_proxy: ${no_proxy}
      WORKER_RUNTIME_ROLE: coding
      OMX_HOST_PATH: ${OMX_HOST_PATH:-./omx}
      OMX_CONTAINER_PATH: ${OMX_CONTAINER_PATH:-/opt/omx}
      OMX_REQUIRED: ${OMX_REQUIRED:-true}
    volumes:
      - codex_multica_home_03:/root/.multica
      - ./codex-configs/codex-03:/root/.codex
      - ${USERPROFILE}/.ssh:/host-ssh:ro
      - ./workspaces/codex-03:/workspace
      - ${OMX_HOST_PATH:-./omx}:${OMX_CONTAINER_PATH:-/opt/omx}:ro

  worker-requirement-01:
    <<: *codex-worker
    environment:
      MULTICA_SERVER_URL: ${MULTICA_SERVER_URL}
      MULTICA_APP_URL: ${MULTICA_APP_URL}
      MULTICA_TOKEN: ${MULTICA_REQUIREMENT_TOKEN_01}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GIT_USER_NAME: ${GIT_USER_NAME}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL}
      GIT_SSH_KEY_FILE: ${GIT_SSH_KEY_FILE}
      DEVICE_NAME: worker-requirement-01
      GSTACK_REQUIRED: "true"
      GSTACK_HOST_PATH: ${GSTACK_HOST_PATH:-./runtime-assets/gstack}
      GSTACK_CONTAINER_PATH: ${GSTACK_CONTAINER_PATH:-/opt/gstack}
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      NO_PROXY: ${NO_PROXY}
      http_proxy: ${http_proxy}
      https_proxy: ${https_proxy}
      no_proxy: ${no_proxy}
    volumes:
      - codex_multica_home_requirement_01:/root/.multica
      - ./codex-configs/requirement-01:/root/.codex
      - ${USERPROFILE}/.ssh:/host-ssh:ro
      - ./workspaces/requirement-01:/workspace
      - ${GSTACK_HOST_PATH:-./runtime-assets/gstack}:${GSTACK_CONTAINER_PATH:-/opt/gstack}:ro

  worker-audit-01:
    <<: *codex-worker
    environment:
      MULTICA_SERVER_URL: ${MULTICA_SERVER_URL}
      MULTICA_APP_URL: ${MULTICA_APP_URL}
      MULTICA_TOKEN: ${MULTICA_AUDIT_TOKEN_01}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GIT_USER_NAME: ${GIT_USER_NAME}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL}
      GIT_SSH_KEY_FILE: ${GIT_SSH_KEY_FILE}
      DEVICE_NAME: worker-audit-01
      GSTACK_REQUIRED: "true"
      GSTACK_HOST_PATH: ${GSTACK_HOST_PATH:-./runtime-assets/gstack}
      GSTACK_CONTAINER_PATH: ${GSTACK_CONTAINER_PATH:-/opt/gstack}
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      NO_PROXY: ${NO_PROXY}
      http_proxy: ${http_proxy}
      https_proxy: ${https_proxy}
      no_proxy: ${no_proxy}
    volumes:
      - codex_multica_home_audit_01:/root/.multica
      - ./codex-configs/audit-01:/root/.codex
      - ${USERPROFILE}/.ssh:/host-ssh:ro
      - ./workspaces/audit-01:/workspace
      - ${GSTACK_HOST_PATH:-./runtime-assets/gstack}:${GSTACK_CONTAINER_PATH:-/opt/gstack}:ro

volumes:
  codex_multica_home_01:
  codex_multica_home_02:
  codex_multica_home_03:
  codex_multica_home_requirement_01:
  codex_multica_home_audit_01:

networks:
  multica_external:
    external: true
    name: multica_default
