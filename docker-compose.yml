x-worker-common-env: &worker-common-env
  MULTICA_SERVER_URL: ${MULTICA_SERVER_URL}
  MULTICA_APP_URL: ${MULTICA_APP_URL}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  GIT_USER_NAME: ${GIT_USER_NAME}
  GIT_USER_EMAIL: ${GIT_USER_EMAIL}
  GIT_SSH_KEY_FILE: ${GIT_SSH_KEY_FILE}
  HTTP_PROXY: ${HTTP_PROXY}
  HTTPS_PROXY: ${HTTPS_PROXY}
  NO_PROXY: ${NO_PROXY}
  http_proxy: ${http_proxy}
  https_proxy: ${https_proxy}
  no_proxy: ${no_proxy}

services:
  worker-base-build:
    build:
      context: .
      dockerfile: worker-base/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
        http_proxy: ${http_proxy}
        https_proxy: ${https_proxy}
        no_proxy: ${no_proxy}
    image: multica-worker-base:latest
    networks:
      - default
      - multica_external

  worker-requirement: &role-worker
    build:
      context: .
      dockerfile: worker-codex/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
        http_proxy: ${http_proxy}
        https_proxy: ${https_proxy}
        no_proxy: ${no_proxy}
        CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:-latest}
    privileged: true
    restart: unless-stopped
    environment:
      <<: *worker-common-env
      MULTICA_TOKEN: ${WORKER_REQUIREMENT_TOKEN_01}
      WORKER_RUNTIME_ROLE: requirement
      DEVICE_NAME: worker-requirement-runtime
    volumes:
      - requirement_multica_home:/root/.multica
      - ./codex-configs/requirement:/root/.codex
      - ${USERPROFILE}/.ssh:/host-ssh:ro
      - ./workspaces/requirement:/workspace
    depends_on:
      - worker-base-build
    networks:
      - default
      - multica_external

  worker-coding:
    <<: *role-worker
    environment:
      <<: *worker-common-env
      MULTICA_TOKEN: ${WORKER_CODING_TOKEN_01}
      WORKER_RUNTIME_ROLE: coding
      DEVICE_NAME: worker-coding-runtime
      OMX_REQUIRED: ${OMX_REQUIRED:-true}
      OMX_SETUP_SCOPE: ${OMX_SETUP_SCOPE:-user}
      OMX_SETUP_ARGS: ${OMX_SETUP_ARGS:---force}
    volumes:
      - coding_multica_home:/root/.multica
      - coding_omx_home:/root/.omx
      - ./codex-configs/coding:/root/.codex
      - ${USERPROFILE}/.ssh:/host-ssh:ro
      - ./workspaces/coding:/workspace

  worker-audit:
    <<: *role-worker
    environment:
      <<: *worker-common-env
      MULTICA_TOKEN: ${MULTICA_AUDIT_TOKEN_01}
      WORKER_RUNTIME_ROLE: audit
      DEVICE_NAME: worker-audit-runtime
    volumes:
      - audit_multica_home:/root/.multica
      - ./codex-configs/audit:/root/.codex
      - ${USERPROFILE}/.ssh:/host-ssh:ro
      - ./workspaces/audit:/workspace

  worker-issue-management:
    <<: *role-worker
    environment:
      <<: *worker-common-env
      MULTICA_TOKEN: ${MULTICA_ISSUE_MANAGEMENT_TOKEN_01}
      WORKER_RUNTIME_ROLE: issue-management
      DEVICE_NAME: worker-issue-management-runtime
    volumes:
      - issue_management_multica_home:/root/.multica
      - ./codex-configs/issue-management:/root/.codex
      - ${USERPROFILE}/.ssh:/host-ssh:ro
      - ./workspaces/issue-management:/workspace

volumes:
  requirement_multica_home:
  coding_multica_home:
  coding_omx_home:
  audit_multica_home:
  issue_management_multica_home:

networks:
  multica_external:
    external: true
    name: multica_default
